name: iOS IPA Build

on:
  workflow_dispatch:
    inputs:
      runner:
        description: GitHub-hosted macOS runner label.
        required: true
        type: choice
        default: macos-15
        options:
          - macos-15
          - macos-15-intel
          - macos-latest
      build_type:
        description: Release produces the normal unsigned IPA; debug is useful while build issues are being sorted out.
        required: true
        type: choice
        default: release
        options:
          - release
          - debug
  push:
    branches:
      - codex/**
    paths:
      - .github/workflows/ios-ipa.yml
      - package.json
      - pnpm-lock.yaml
      - webpack.config.js
      - src/**
      - src-tauri/**
      - docs/ios-agent-background.md
      - docs/ios-ipa-github-actions.md

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-ios-ipa:
    runs-on: ${{ inputs.runner || 'macos-15' }}
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Apple toolchain
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend assets
        run: pnpm run web:build

      - name: Check Rust iOS target
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml --target aarch64-apple-ios

      - name: Disable Xcode signing for unsigned artifact
        shell: bash
        run: |
          set -euo pipefail

          unsigned_xcconfig="$RUNNER_TEMP/unsigned-ios.xcconfig"
          cat > "$unsigned_xcconfig" <<'EOF'
          CODE_SIGNING_ALLOWED = NO
          CODE_SIGNING_REQUIRED = NO
          CODE_SIGN_IDENTITY =
          CODE_SIGN_STYLE = Manual
          DEVELOPMENT_TEAM =
          PROVISIONING_PROFILE =
          PROVISIONING_PROFILE_SPECIFIER =
          EOF
          echo "XCODE_XCCONFIG_FILE=$unsigned_xcconfig" >> "$GITHUB_ENV"

          /usr/bin/python3 - <<'PY'
          from pathlib import Path

          project = Path("src-tauri/gen/apple/tauritavern.xcodeproj/project.pbxproj")
          text = project.read_text()
          original = text
          text = text.replace(
              'CODE_SIGN_IDENTITY = "iPhone Developer";',
              'CODE_SIGN_IDENTITY = "";\n'
              '\t\t\t\tCODE_SIGNING_ALLOWED = NO;\n'
              '\t\t\t\tCODE_SIGNING_REQUIRED = NO;\n'
              '\t\t\t\tCODE_SIGN_STYLE = Manual;',
          )
          text = text.replace(
              'DEVELOPMENT_TEAM = "Y82Q3U47CB";',
              'DEVELOPMENT_TEAM = "";\n'
              '\t\t\t\tPROVISIONING_PROFILE = "";\n'
              '\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "";',
          )
          if text == original:
              raise SystemExit("No Xcode signing settings were patched")
          project.write_text(text)
          PY

      - name: Build unsigned iOS app
        shell: bash
        run: |
          set -euo pipefail

          args=(ios build --verbose --ci --export-method debugging)
          configuration="release"
          if [[ "${{ inputs.build_type || 'release' }}" == "debug" ]]; then
            args+=(--debug)
            configuration="debug"
          fi

          set +e
          pnpm tauri "${args[@]}"
          tauri_status=$?
          set -e

          app_candidates_file="$RUNNER_TEMP/ios-app-candidates.txt"
          find \
            src-tauri/gen/apple/build \
            "$HOME/Library/Developer/Xcode/DerivedData" \
            -type d \
            -name '*.app' \
            ! -path '*iphonesimulator*' \
            -print \
            > "$app_candidates_file" \
            2>/dev/null || true

          app_path=""
          while IFS= read -r candidate; do
            info_plist="$candidate/Info.plist"
            if [[ ! -f "$info_plist" ]]; then
              continue
            fi

            executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$info_plist" 2>/dev/null || true)"
            if [[ -n "$executable" && -f "$candidate/$executable" ]]; then
              app_path="$candidate"
              break
            fi
          done < "$app_candidates_file"

          if [[ -z "$app_path" ]]; then
            echo "::error::No complete unsigned .app bundle was found after tauri ios build."
            find src-tauri/gen/apple -maxdepth 6 \( -name '*.app' -o -name '*.xcarchive' -o -name '*.ipa' \) -print || true
            find "$HOME/Library/Developer/Xcode/DerivedData" -maxdepth 8 \( -name '*.app' -o -name '*.xcarchive' -o -name '*.ipa' \) -print || true
            exit 1
          fi

          app_size_kb="$(du -sk "$app_path" | awk '{print $1}')"
          if [[ "$app_size_kb" -lt 1024 ]]; then
            echo "::error::Resolved app bundle is unexpectedly small (${app_size_kb} KiB): $app_path"
            find "$app_path" -maxdepth 2 -print || true
            exit 1
          fi

          if [[ "$tauri_status" -ne 0 ]]; then
            echo "::warning::tauri ios build exited with status $tauri_status after producing a complete unsigned app bundle."
            echo "::warning::Continuing with manual IPA packaging; unsigned CI builds can fail during xcodebuild -exportArchive because no teamID is available."
          fi

          echo "Resolved unsigned app bundle: $app_path (${app_size_kb} KiB)"

          {
            echo "IOS_BUILD_CONFIGURATION=$configuration"
            echo "IOS_APP_PATH=$app_path"
          } >> "$GITHUB_ENV"

      - name: Package unsigned IPA for local sideload signing
        shell: bash
        run: |
          set -euo pipefail

          app_path="${IOS_APP_PATH:-}"
          if [[ -z "$app_path" || ! -d "$app_path" ]]; then
            echo "::error::No unsigned .app bundle is available at IOS_APP_PATH=$app_path."
            exit 1
          fi

          mkdir -p dist-ios
          rm -rf dist-ios/Payload
          mkdir -p dist-ios/Payload

          app_name="$(basename "$app_path")"
          /usr/bin/ditto "$app_path" "dist-ios/Payload/$app_name"
          app_size_kb="$(du -sk "dist-ios/Payload/$app_name" | awk '{print $1}')"
          if [[ "$app_size_kb" -lt 1024 ]]; then
            echo "::error::Copied app bundle is unexpectedly small (${app_size_kb} KiB)."
            find "dist-ios/Payload/$app_name" -maxdepth 2 -print || true
            exit 1
          fi

          ipa_name="TauriTavern-iOS-unsigned-${IOS_BUILD_CONFIGURATION}.ipa"
          (cd dist-ios && /usr/bin/zip -qry "$ipa_name" Payload)
          ipa_size_bytes="$(stat -f%z "dist-ios/$ipa_name")"
          if [[ "$ipa_size_bytes" -lt 1048576 ]]; then
            echo "::error::Packaged IPA is unexpectedly small (${ipa_size_bytes} bytes)."
            /usr/bin/unzip -l "dist-ios/$ipa_name" | sed -n '1,80p' || true
            exit 1
          fi

          rm -rf dist-ios/Payload

          ls -la dist-ios

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: TauriTavern-iOS-unsigned-${{ inputs.build_type || 'release' }}
          path: dist-ios/*.ipa
          if-no-files-found: error
