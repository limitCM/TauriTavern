name: iOS IPA Build

on:
  workflow_dispatch:
    inputs:
      runner:
        description: GitHub-hosted macOS runner label.
        required: true
        type: choice
        default: macos-15
        options:
          - macos-15
          - macos-15-intel
          - macos-latest
      build_type:
        description: Release produces the normal unsigned IPA; debug is useful while build issues are being sorted out.
        required: true
        type: choice
        default: release
        options:
          - release
          - debug
  push:
    branches:
      - codex/**
    paths:
      - .github/workflows/ios-ipa.yml
      - package.json
      - pnpm-lock.yaml
      - webpack.config.js
      - src/**
      - src-tauri/**
      - docs/ios-agent-background.md
      - docs/ios-ipa-github-actions.md

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-ios-ipa:
    runs-on: ${{ inputs.runner || 'macos-15' }}
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Apple toolchain
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend assets
        run: pnpm run web:build

      - name: Check Rust iOS target
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml --target aarch64-apple-ios

      - name: Build unsigned iOS app
        shell: bash
        run: |
          set -euo pipefail

          configuration="release"
          if [[ "${{ inputs.build_type || 'release' }}" == "debug" ]]; then
            configuration="debug"
          fi

          derived_data="$RUNNER_TEMP/tauritavern-ios-derived"
          xcodebuild \
            -project src-tauri/gen/apple/tauritavern.xcodeproj \
            -scheme tauritavern_iOS \
            -configuration "$configuration" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$derived_data" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

          {
            echo "IOS_BUILD_CONFIGURATION=$configuration"
            echo "IOS_DERIVED_DATA=$derived_data"
          } >> "$GITHUB_ENV"

      - name: Package unsigned IPA for local sideload signing
        shell: bash
        run: |
          set -euo pipefail

          app_path="$(find "$IOS_DERIVED_DATA/Build/Products" -type d -path '*iphoneos/*.app' -print -quit)"
          if [[ -z "$app_path" ]]; then
            echo "::error::No unsigned .app bundle was found under $IOS_DERIVED_DATA/Build/Products."
            find "$IOS_DERIVED_DATA/Build/Products" -maxdepth 4 -print || true
            exit 1
          fi

          mkdir -p dist-ios
          rm -rf dist-ios/Payload
          mkdir -p dist-ios/Payload

          cp -R "$app_path" dist-ios/Payload/
          ipa_name="TauriTavern-iOS-unsigned-${IOS_BUILD_CONFIGURATION}.ipa"
          (cd dist-ios && /usr/bin/zip -qry "$ipa_name" Payload)
          rm -rf dist-ios/Payload

          ls -la dist-ios

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: TauriTavern-iOS-unsigned-${{ inputs.build_type || 'release' }}
          path: dist-ios/*.ipa
          if-no-files-found: error
