name: iOS IPA Build

on:
  workflow_dispatch:
    inputs:
      runner:
        description: GitHub-hosted macOS runner label.
        required: true
        type: choice
        default: macos-15
        options:
          - macos-15
          - macos-15-intel
          - macos-latest
      build_type:
        description: Release produces the normal unsigned IPA; debug is useful while build issues are being sorted out.
        required: true
        type: choice
        default: release
        options:
          - release
          - debug
  push:
    branches:
      - codex/**
    paths:
      - .github/workflows/ios-ipa.yml
      - package.json
      - pnpm-lock.yaml
      - webpack.config.js
      - src/**
      - src-tauri/**
      - docs/ios-agent-background.md
      - docs/ios-ipa-github-actions.md

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-ios-ipa:
    runs-on: ${{ inputs.runner || 'macos-15' }}
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Apple toolchain
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend assets
        run: pnpm run web:build

      - name: Check Rust iOS target
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml --target aarch64-apple-ios

      - name: Build unsigned iOS app
        shell: bash
        run: |
          set -euo pipefail

          args=(ios build --verbose --ci --export-method debugging)
          configuration="release"
          if [[ "${{ inputs.build_type || 'release' }}" == "debug" ]]; then
            args+=(--debug)
            configuration="debug"
          fi

          tauri_status=0
          pnpm tauri "${args[@]}" -- \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE="" \
            PROVISIONING_PROFILE_SPECIFIER="" || tauri_status=$?

          app_path="$(
            find \
              src-tauri/gen/apple/build \
              "$HOME/Library/Developer/Xcode/DerivedData" \
              -type d \
              -name '*.app' \
              ! -path '*iphonesimulator*' \
              -print \
              -quit 2>/dev/null || true
          )"
          if [[ -z "$app_path" ]]; then
            echo "::error::No unsigned .app bundle was found after tauri ios build."
            find src-tauri/gen/apple -maxdepth 6 \( -name '*.app' -o -name '*.xcarchive' -o -name '*.ipa' \) -print || true
            find "$HOME/Library/Developer/Xcode/DerivedData" -maxdepth 8 \( -name '*.app' -o -name '*.xcarchive' -o -name '*.ipa' \) -print || true
            if [[ "$tauri_status" -eq 0 ]]; then
              tauri_status=1
            fi
            exit "$tauri_status"
          fi

          if [[ "$tauri_status" -ne 0 ]]; then
            echo "::notice::tauri ios build exited with $tauri_status after producing $app_path. Continuing because the workflow packages an unsigned IPA for local sideload signing."
          fi

          {
            echo "IOS_BUILD_CONFIGURATION=$configuration"
            echo "IOS_APP_PATH=$app_path"
          } >> "$GITHUB_ENV"

      - name: Package unsigned IPA for local sideload signing
        shell: bash
        run: |
          set -euo pipefail

          app_path="${IOS_APP_PATH:-}"
          if [[ -z "$app_path" || ! -d "$app_path" ]]; then
            echo "::error::No unsigned .app bundle is available at IOS_APP_PATH=$app_path."
            exit 1
          fi

          mkdir -p dist-ios
          rm -rf dist-ios/Payload
          mkdir -p dist-ios/Payload

          cp -R "$app_path" dist-ios/Payload/
          ipa_name="TauriTavern-iOS-unsigned-${IOS_BUILD_CONFIGURATION}.ipa"
          (cd dist-ios && /usr/bin/zip -qry "$ipa_name" Payload)
          rm -rf dist-ios/Payload

          ls -la dist-ios

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: TauriTavern-iOS-unsigned-${{ inputs.build_type || 'release' }}
          path: dist-ios/*.ipa
          if-no-files-found: error
